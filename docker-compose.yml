version: '3.8'

services:
  frontend:
    build:
      context: ./kerubiscan
      dockerfile: Dockerfile
    ports:
      - "9443:3000"
    environment:
      # Updated to use Docker network service name for Kimia
      - BACKEND_API_URL=http://api:8000
    depends_on:
      - keycloak
    networks:
      - kerubiscan-net

  keycloak:
    build:
      context: ./keycloak-theme
      dockerfile: Dockerfile
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "1990:8080"
    networks:
      - kerubiscan-net

networks:
  kerubiscan-net:
    external: true
